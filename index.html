<!DOCTYPE html>
<html lang="fr">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no" />
	<title>Labyrinthe Puzzle</title>
	<script src="coi-serviceworker.js"></script>
	<style>
		body {
			margin: 0;
			padding: 0;
			background-color: #222;
			color: #fff;
			font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
		}

		#canvas-container {
			display: flex;
			justify-content: center;
			align-items: center;
			min-height: 100vh;
		}

		canvas {
			display: block;
			margin: 0;
			color: white;
		}

		canvas:focus {
			outline: none;
		}

		.godot {
			max-width: 100%;
			max-height: 100vh;
		}

		#status {
			position: absolute;
			left: 0;
			top: 0;
			right: 0;
			bottom: 0;
			display: flex;
			justify-content: center;
			align-items: center;
			background-color: #222;
		}

		#status-progress {
			width: 366px;
			height: 7px;
			background-color: #38363A;
			border: 1px solid #444;
			padding: 1px;
			box-shadow: 0 0 2px 1px #1B1C22;
			border-radius: 2px;
			visibility: visible;
		}

		@media only screen and (orientation:portrait) {
			#status-progress {
				width: 61.8%;
			}
		}

		#status-progress-inner {
			height: 100%;
			width: 0;
			box-sizing: border-box;
			transition: width 0.5s linear;
			background-color: #202020;
			border: 1px solid #222;
			box-shadow: 0 0 1px 1px #27282E;
			border-radius: 3px;
		}

		#status-indeterminate {
			visibility: visible;
			position: relative;
		}

		#status-indeterminate > div {
			width: 4.5px;
			height: 0;
			border-style: solid;
			border-width: 9px 3px 0 3px;
			border-color: #2b2b2b transparent transparent transparent;
			transform-origin: center 21px;
			position: absolute;
		}

		#status-indeterminate > div:nth-child(1) { transform: rotate( 22.5deg); }
		#status-indeterminate > div:nth-child(2) { transform: rotate( 67.5deg); }
		#status-indeterminate > div:nth-child(3) { transform: rotate(112.5deg); }
		#status-indeterminate > div:nth-child(4) { transform: rotate(157.5deg); }
		#status-indeterminate > div:nth-child(5) { transform: rotate(202.5deg); }
		#status-indeterminate > div:nth-child(6) { transform: rotate(247.5deg); }
		#status-indeterminate > div:nth-child(7) { transform: rotate(292.5deg); }
		#status-indeterminate > div:nth-child(8) { transform: rotate(337.5deg); }

		#status-notice {
			margin: 0 100px;
			line-height: 1.3;
			text-align: center;
			font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
			font-size: 14px;
		}

		.hidden {
			display: none !important;
		}
	</style>
</head>
<body>
	<div id="canvas-container">
		<canvas id="canvas">
			HTML5 canvas appears to be unsupported in the current browser.<br />
			Please try updating or use a different browser.
		</canvas>
	</div>

	<div id="status">
		<div id="status-progress" class="hidden">
			<div id="status-progress-inner"></div>
		</div>
		<div id="status-indeterminate">
			<div></div>
			<div></div>
			<div></div>
			<div></div>
			<div></div>
			<div></div>
			<div></div>
			<div></div>
		</div>
		<div id="status-notice" class="godot"></div>
	</div>

	<script src="$GODOT_BASENAME.js"></script>
	<script>
		var engine = new Engine({"args":[],"canvasResizePolicy":2,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":17888,"index.wasm":35708238},"focusCanvas":true,"gdextensionLibs":[]});
		var canvas = document.getElementById('canvas');
		var statusProgress = document.getElementById('status-progress');
		var statusProgressInner = document.getElementById('status-progress-inner');
		var statusIndeterminate = document.getElementById('status-indeterminate');
		var statusNotice = document.getElementById('status-notice');
		var status = document.getElementById('status');

		function setStatusMode(mode) {
			if (mode === 'hidden') {
				status.classList.add('hidden');
			} else {
				status.classList.remove('hidden');
			}

			if (mode === 'progress') {
				statusProgress.classList.remove('hidden');
				statusIndeterminate.classList.add('hidden');
			} else if (mode === 'indeterminate') {
				statusProgress.classList.add('hidden');
				statusIndeterminate.classList.remove('hidden');
			} else {
				statusProgress.classList.add('hidden');
				statusIndeterminate.classList.add('hidden');
			}
		}

		function setStatusNotice(text) {
			while (statusNotice.lastChild) {
				statusNotice.removeChild(statusNotice.lastChild);
			}
			var lines = text.split('\n');
			lines.forEach((line) => {
				statusNotice.appendChild(document.createTextNode(line));
				statusNotice.appendChild(document.createElement('br'));
			});
		}

		function displayFailureNotice(err) {
			var msg = err.message || err;
			console.error(msg);
			setStatusNotice(msg);
			setStatusMode('indeterminate');
		}

		var initializing = true;
		setStatusMode('indeterminate');
		setStatusNotice("Chargement...");

		engine.startGame({
			'onProgress': function (current, total) {
				if (total > 0) {
					statusProgressInner.style.width = current/total * 100 + '%';
					setStatusMode('progress');
					if (current === total) {
						setTimeout(() => {
							setStatusMode('indeterminate');
						}, 500);
					}
				} else {
					setStatusMode('indeterminate');
				}
			}
		}).then(() => {
			setStatusMode('hidden');
			initializing = false;
		}, displayFailureNotice);
	</script>
</body>
</html>
